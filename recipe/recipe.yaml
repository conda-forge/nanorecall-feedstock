context:
  version: "0.1.3"

package:
  name: nanorecall
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nanorecall/nanorecall-${{ version }}.tar.gz
  sha256: 168e82514833d2d1c67b77d8e93233855206e8169e582f0ecaa40c67d981d1bb

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.20

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - nanorecall
      pip_check: true
  - script:
      - python -m nanorecall.cli --help

about:
  homepage: https://github.com/eminsk/nanorecall
  summary: 100% Private, Zero-Cloud, Bare-Metal Desktop Memory & Screen Search Engine
  description: |
    A high-performance, open-source, 100% private alternative to Microsoft
    Windows Recall engineered with pure C99/SIMD and zero cloud telemetry.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/eminsk/nanorecall
  documentation: https://github.com/eminsk/nanorecall#readme

extra:
  recipe-maintainers:
    - eminsk
